<!-- contact form -->
<article>
<section>
<h2>Contact Form</h2>

<form action="mailto:ashwin.rajakrishna@ontariotechu.net" method="post" enctype="text/plain" name="form">

<p>
<label for="name">Name</label><br>
<input type="text" id="name" name="name" size="32" required>
</p>

<p>
<label for="email">Email</label><br>
<input type="email" id="email" name="email" size="40" required>
</p>

<p>
<label for="phone">Cell No.</label><br>
<input type="tel" id="phone" name="phone" size="32" required>
</p>

<p>
<label for="comments">Comments</label><br>
<textarea id="comments" name="comments" cols="60" rows="6" required></textarea>
</p>

<p>
<input type="submit" value="Submit">
</p>

</form>
</section>
